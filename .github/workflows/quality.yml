name: Quality

on:
  pull_request:
    branches:
      - dev
      - master
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

concurrency:
  group: quality-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    if: ${{ github.head_ref != 'release' && !startsWith(github.head_ref, 'release/') }}
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Activate pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: windows-rust-1.97-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-rust-1.97-

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate release rules and version agreement
        shell: pwsh
        run: ./scripts/release/Test-ReleasePipeline.ps1

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@ae83f8e2d0da9969dc5a35e824115e142fd3c341 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Test with coverage
        run: npm run test:coverage
