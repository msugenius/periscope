name: Quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - master
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Activate pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: windows-rust-1.97-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-rust-1.97-

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate release rules and version agreement
        shell: pwsh
        run: ./scripts/release/Test-ReleasePipeline.ps1

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Install Rust coverage tool
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@ae83f8e2d0da9969dc5a35e824115e142fd3c341 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Test with coverage
        if: github.event_name == 'pull_request'
        run: npm run test:coverage
