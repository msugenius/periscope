name: Windows Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions: {}

concurrency:
  group: master-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate, build, and sign
    if: github.event.pull_request.merged == true
    runs-on: windows-2025
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
    outputs:
      skip_publish: ${{ steps.inspect.outputs.skip_publish }}
      version: ${{ steps.inspect.outputs.version }}
      tag: ${{ steps.inspect.outputs.tag }}

    steps:
      - name: Check out exact merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Activate pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: windows-release-rust-1.97-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-release-rust-1.97-

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate version and inspect retry state
        id: inspect
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./scripts/release/ReleasePipeline.psm1 -Force
          $version = Assert-VersionAgreement (Get-VersionDeclarations $PWD)
          $sha = $env:TRUSTED_MERGE_SHA.ToLowerInvariant()
          $releasePagesJson = gh api --paginate --slurp "/repos/$env:TRUSTED_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases." }
          $releases = @(ConvertFrom-GitHubApiPages $releasePagesJson)
          $disposition = Get-ReleaseDisposition -Version $version -MergeSha $sha -Releases $releases
          $refs = @(gh api "/repos/$env:TRUSTED_REPOSITORY/git/matching-refs/tags/$($disposition.Tag)" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $refs.Count -gt 1) { throw "Could not establish one deterministic tag state." }
          if ($refs.Count -eq 1 -and $refs[0].object.sha -cne $sha) { throw "Release tag already targets another object." }
          if ($refs.Count -eq 1 -and $disposition.State -eq "build-new") { throw "Release tag exists without a matching release." }
          $earlier = @($releases | Where-Object tag_name -ne $disposition.Tag)
          Assert-ReleaseVersion -Version $version -Releases $earlier -MigrationFloor "0.1.0" | Out-Null

          $skip = "false"
          if ($disposition.State -eq "verify-published") {
            if ($disposition.Release.prerelease -or @($disposition.Release.assets).Count -ne 4) {
              throw "Published retry does not contain one verified stable four-asset release."
            }
            $names = @($disposition.Release.assets.name)
            $expected = @("periScope_${version}_x64-setup.exe", "periScope_${version}_x64-setup.exe.sig", "latest.json", "release-manifest.json")
            if (@($expected | Where-Object { $_ -notin $names }).Count -ne 0) { throw "Published retry assets conflict with the release contract." }
            $retryRoot = New-Item retry-release -ItemType Directory -Force
            gh release download $disposition.Tag --repo $env:TRUSTED_REPOSITORY --dir $retryRoot.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not download published assets for retry verification." }
            $manifest = Get-Content (Join-Path $retryRoot "release-manifest.json") -Raw | ConvertFrom-Json
            if (-not (Test-PublicReleaseManifest $manifest $retryRoot.FullName $env:TRUSTED_REPOSITORY $sha $version)) { throw "Published retry manifest or asset bytes conflict." }
            $metadata = Get-Content (Join-Path $retryRoot "latest.json") -Raw | ConvertFrom-Json
            $signature = Get-Content (Join-Path $retryRoot "periScope_${version}_x64-setup.exe.sig") -Raw
            $expectedUrl = "https://github.com/$env:TRUSTED_REPOSITORY/releases/download/$($disposition.Tag)/periScope_${version}_x64-setup.exe"
            if ($metadata.version -cne $version -or $metadata.sourceCommit -cne $sha -or $metadata.platforms.'windows-x86_64'.url -cne $expectedUrl -or $metadata.platforms.'windows-x86_64'.signature -cne $signature) { throw "Published updater metadata conflicts with the signed assets." }
            $latest = gh api "/repos/$env:TRUSTED_REPOSITORY/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $latest.id -ne $disposition.Release.id) { throw "Completed retry is not the current latest release." }
            $skip = "true"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$($disposition.Tag)" >> $env:GITHUB_OUTPUT
          "skip_publish=$skip" >> $env:GITHUB_OUTPUT

      - name: Remove cached installer outputs
        if: steps.inspect.outputs.skip_publish != 'true'
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if (Test-Path -LiteralPath $nsis) { Remove-Item -LiteralPath $nsis -Recurse -Force }

      - name: Build and sign x64 NSIS updater
        if: steps.inspect.outputs.skip_publish != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Create deterministic private handoff
        if: steps.inspect.outputs.skip_publish != 'true'
        shell: pwsh
        env:
          TRUSTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.inspect.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./scripts/release/ReleasePipeline.psm1 -Force
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installerName = "periScope_$env:RELEASE_VERSION`_x64-setup.exe"
          $installer = Get-Item -LiteralPath (Join-Path $bundle $installerName)
          $signature = Get-Item -LiteralPath "$($installer.FullName).sig"
          $handoffRoot = New-Item release-handoff -ItemType Directory -Force
          $copiedInstaller = Copy-Item -LiteralPath $installer.FullName -Destination $handoffRoot -PassThru
          $copiedSignature = Copy-Item -LiteralPath $signature.FullName -Destination $handoffRoot -PassThru
          $handoff = New-ReleaseHandoff -Repository $env:TRUSTED_REPOSITORY -MergeSha $env:TRUSTED_MERGE_SHA.ToLowerInvariant() -Version $env:RELEASE_VERSION -InstallerPath $copiedInstaller.FullName -SignaturePath $copiedSignature.FullName
          $handoff | ConvertTo-Json -Depth 8 | Set-Content release-handoff/release-handoff.json -Encoding utf8
          if (-not (Test-ReleaseHandoff $handoff $handoffRoot.FullName $env:TRUSTED_REPOSITORY $env:TRUSTED_MERGE_SHA.ToLowerInvariant() $env:RELEASE_VERSION)) { throw "Private handoff verification failed." }

      - name: Upload exact signed handoff
        if: steps.inspect.outputs.skip_publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ github.event.pull_request.merge_commit_sha }}
          path: release-handoff/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Verify and publish
    if: github.event.pull_request.merged == true && needs.build.outputs.skip_publish != 'true'
    needs: [build]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download exact signed handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ github.event.pull_request.merge_commit_sha }}
          path: release-handoff

      - name: Validate handoff, create assets, and publish last
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          function Evidence([System.IO.FileInfo]$File) {
            [ordered]@{ name=$File.Name; sizeBytes=[long]$File.Length; sha256=(Get-FileHash $File.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          function Assert-Evidence($Expected, [System.IO.FileInfo]$File) {
            $actual = Evidence $File
            if ($Expected.name -cne $actual.name -or [long]$Expected.sizeBytes -ne $actual.sizeBytes -or $Expected.sha256 -cne $actual.sha256) { throw "File evidence conflict for $($File.Name)." }
          }
          function Assert-Assets($Release, $Files) {
            $assets = @($Release.assets)
            if ($assets.Count -ne 4) { throw "Expected exactly four release assets; found $($assets.Count)." }
            foreach ($file in $Files) {
              $asset = @($assets | Where-Object name -eq $file.Name)
              $digest = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($asset.Count -ne 1 -or [long]$asset[0].size -ne $file.Length -or $asset[0].digest -cne "sha256:$digest") { throw "Release asset conflict for $($file.Name)." }
            }
          }

          $sha = $env:TRUSTED_MERGE_SHA.ToLowerInvariant()
          if ($sha -cnotmatch "^[0-9a-f]{40}$" -or $env:RELEASE_TAG -cne "v$env:RELEASE_VERSION") { throw "Trusted release identity is malformed." }
          $root = (Resolve-Path release-handoff).Path
          $files = @(Get-ChildItem -LiteralPath $root -File)
          if ($files.Count -ne 3) { throw "Private handoff must contain installer, signature, and handoff JSON only." }
          $handoffFile = Get-Item "$root/release-handoff.json"
          $handoff = Get-Content $handoffFile.FullName -Raw | ConvertFrom-Json
          if ($handoff.schemaVersion -cne "2" -or $handoff.repository -cne $env:TRUSTED_REPOSITORY -or $handoff.mergeSha -cne $sha -or $handoff.version -cne $env:RELEASE_VERSION -or $handoff.tag -cne $env:RELEASE_TAG) { throw "Private handoff identity conflict." }
          $installer = Get-Item (Join-Path $root $handoff.installer.name)
          $signature = Get-Item (Join-Path $root $handoff.signature.name)
          if ($installer.Name -cne "periScope_$env:RELEASE_VERSION`_x64-setup.exe" -or $signature.Name -cne "$($installer.Name).sig") { throw "Unsafe or inconsistent handoff filenames." }
          Assert-Evidence $handoff.installer $installer
          Assert-Evidence $handoff.signature $signature

          $releasePagesJson = gh api --paginate --slurp "/repos/$env:TRUSTED_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release state." }
          $all = @(($releasePagesJson | ConvertFrom-Json) | ForEach-Object { $_ })
          $existing = @($all | Where-Object tag_name -eq $env:RELEASE_TAG)
          if ($existing.Count -gt 1 -or ($existing.Count -eq 1 -and $existing[0].target_commitish -cne $sha)) { throw "Release tag or target conflict." }
          if ($existing.Count -eq 1 -and -not $existing[0].draft) { throw "Published release appeared after early inspection; rerun for verified no-op." }

          $stable = @($all | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' })
          $previous = $stable | Sort-Object { [version]$_.tag_name.Substring(1) } | Select-Object -Last 1
          if (-not $previous) { $previous = $all | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^release-[0-9a-f]{40}$' } | Sort-Object published_at | Select-Object -Last 1 }
          $notesRequest = [ordered]@{ tag_name=$env:RELEASE_TAG; target_commitish=$sha }
          if ($previous) { $notesRequest.previous_tag_name = $previous.tag_name }
          $notesRequest | ConvertTo-Json | Set-Content "$root/notes-request.json" -Encoding utf8
          $generated = gh api --method POST "/repos/$env:TRUSTED_REPOSITORY/releases/generate-notes" --input "$root/notes-request.json" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not generate release notes." }
          $notes = [string]$generated.body
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "Generated release notes are empty." }
          Set-Content "$root/release-notes.md" $notes -Encoding utf8

          $signatureText = Get-Content $signature.FullName -Raw
          if ([string]::IsNullOrWhiteSpace($signatureText)) { throw "Updater signature is empty." }
          $latest = [ordered]@{ version=$env:RELEASE_VERSION; notes=$notes; sourceCommit=$sha; platforms=[ordered]@{ 'windows-x86_64'=[ordered]@{ signature=$signatureText; url="https://github.com/$env:TRUSTED_REPOSITORY/releases/download/$env:RELEASE_TAG/$($installer.Name)" } } }
          $latestPath = "$root/latest.json"
          $latest | ConvertTo-Json -Depth 8 | Set-Content $latestPath -Encoding utf8
          $latestFile = Get-Item $latestPath
          $manifest = [ordered]@{ schemaVersion="2"; repository=$env:TRUSTED_REPOSITORY; mergeSha=$sha; version=$env:RELEASE_VERSION; tag=$env:RELEASE_TAG; installer=(Evidence $installer); signature=(Evidence $signature); updaterMetadata=(Evidence $latestFile) }
          $manifestPath = "$root/release-manifest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $manifestPath -Encoding utf8
          $manifestFile = Get-Item $manifestPath
          $publicFiles = @($installer, $signature, $latestFile, $manifestFile)

          $title = "periScope $env:RELEASE_VERSION (PR #$env:TRUSTED_PR_NUMBER, $($sha.Substring(0,7)))"
          $draftRequest = [ordered]@{ tag_name=$env:RELEASE_TAG; target_commitish=$sha; name=$title; body=$notes; draft=$true; prerelease=$false; make_latest="false" }
          $draftRequestPath = "$root/draft-request.json"
          $draftRequest | ConvertTo-Json -Depth 8 | Set-Content $draftRequestPath -Encoding utf8
          if ($existing.Count -eq 0) {
            $draft = gh api --method POST "/repos/$env:TRUSTED_REPOSITORY/releases" --input $draftRequestPath | ConvertFrom-Json
          } else {
            $draft = gh api --method PATCH "/repos/$env:TRUSTED_REPOSITORY/releases/$($existing[0].id)" --input $draftRequestPath | ConvertFrom-Json
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create or resume the draft release." }
          if ([long]$draft.id -le 0 -or -not $draft.draft -or $draft.tag_name -cne $env:RELEASE_TAG -or $draft.target_commitish -cne $sha) { throw "Draft identity verification failed." }
          $uploadBase = "https://uploads.github.com/repos/$env:TRUSTED_REPOSITORY/releases/$($draft.id)/assets"
          if ($draft.upload_url -cne "${uploadBase}{?name,label}") { throw "Draft upload URL verification failed." }
          $unexpected = @($draft.assets | Where-Object name -notin $publicFiles.Name)
          if ($unexpected.Count -gt 0) { throw "Draft contains unexpected assets." }
          foreach ($file in $publicFiles) {
            $asset = @($draft.assets | Where-Object name -eq $file.Name)
            if ($asset.Count -gt 1) { throw "Draft contains duplicate asset $($file.Name)." }
            if ($asset.Count -eq 1) {
              $digest = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ([long]$asset[0].size -ne $file.Length -or $asset[0].digest -cne "sha256:$digest") { throw "Draft asset conflict for $($file.Name)." }
            } else {
              $uploadUri = "$uploadBase`?name=$([uri]::EscapeDataString($file.Name))"
              Invoke-RestMethod -Method Post -Uri $uploadUri -Headers @{ Accept="application/vnd.github+json"; Authorization="Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version"="2026-03-10" } -ContentType "application/octet-stream" -InFile $file.FullName | Out-Null
            }
          }
          $verified = gh api "/repos/$env:TRUSTED_REPOSITORY/releases/$($draft.id)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not verify uploaded draft assets." }
          Assert-Assets $verified $publicFiles
          $publishRequestPath = "$root/publish-request.json"
          [ordered]@{ draft=$false; make_latest="true" } | ConvertTo-Json | Set-Content $publishRequestPath -Encoding utf8
          $published = gh api --method PATCH "/repos/$env:TRUSTED_REPOSITORY/releases/$($draft.id)" --input $publishRequestPath | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Final publish/latest mutation failed." }
          $currentLatest = gh api "/repos/$env:TRUSTED_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($published.draft -or $published.prerelease -or $published.target_commitish -cne $sha -or $currentLatest.id -ne $published.id) { throw "Published/latest state verification failed." }
          Assert-Assets $published $publicFiles
